name: Quality Gate & CI Pipeline

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_gate:
    name: Quality Gate (Analyze & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restaurar Dependencias
        run: flutter pub get

      - name: Linter y Análisis Estático (Quality Gate)
        run: flutter analyze

      - name: Ejecutar Pruebas Unitarias y Cobertura (Coverage)
        run: flutter test --coverage

      - name: Subir Reporte de Cobertura (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage-report
          path: coverage/
          if-no-files-found: ignore
