name: Compilar Victor Engineer Food Tracker Windows (PC)

on:
  workflow_dispatch:

jobs:
  build_windows:
    name: Construir Ejecutable Windows x64 (Victor Engineer Food Tracker)
    runs-on: windows-2022

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Visual Studio / MSVC C++ Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Habilitar Soporte de Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Diagnóstico de Entorno Flutter
        run: flutter doctor -v

      - name: Generar Archivos de Plataforma Windows
        run: flutter create --project-name food_tracker --platforms windows .

      - name: Restaurar Dependencias
        run: flutter pub get

      - name: Compilar Aplicación para Windows (Release)
        run: flutter build windows --release

      - name: Empaquetar Release en ZIP
        shell: pwsh
        run: |
          $releasePath = if (Test-Path "build\windows\x64\runner\Release") { 
              "build\windows\x64\runner\Release" 
          } elseif (Test-Path "build\windows\runner\Release") { 
              "build\windows\runner\Release" 
          } else { 
              Get-ChildItem -Path "build\windows" -Recurse -Filter "*.exe" | Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          }
          Write-Host "Directorio de release detectado: $releasePath"

          # Verificar y asegurar que sqlite3.dll este presente en el directorio de release
          if (-not (Test-Path "$releasePath\sqlite3.dll")) {
              Write-Warning "sqlite3.dll no esta directamente en $releasePath. Buscando en build\windows..."
              $foundSqlite = Get-ChildItem -Path "build\windows" -Recurse -Filter "sqlite3.dll" | Select-Object -First 1
              if ($foundSqlite) {
                  Write-Host "Copiando $($foundSqlite.FullName) a $releasePath"
                  Copy-Item -Path $foundSqlite.FullName -Destination $releasePath -Force
              } else {
                  Write-Error "ERROR: sqlite3.dll no fue encontrado en ningun lugar de build\windows!"
                  exit 1
              }
          }

          Write-Host "Archivos a empaquetar en: $releasePath"
          Get-ChildItem -Path $releasePath | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize

          New-Item -ItemType Directory -Force -Path "dist"
          Compress-Archive -Path "$releasePath\*" -DestinationPath "dist\Victor-Engineer-Food-Tracker-Windows-x64.zip" -Force
          Write-Host "Archivo ZIP generado exitosamente en dist\Victor-Engineer-Food-Tracker-Windows-x64.zip"

      - name: Subir Binario de Windows al Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Victor-Engineer-Food-Tracker-Windows-x64
          path: dist/Victor-Engineer-Food-Tracker-Windows-x64.zip
