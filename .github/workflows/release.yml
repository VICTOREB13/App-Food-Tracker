name: Publicar Release Oficial

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality_gate:
    name: Quality Gate (Analyze & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restaurar Dependencias
        run: flutter pub get

      - name: Linter y Análisis Estático (Quality Gate)
        run: flutter analyze

      - name: Ejecutar Pruebas Automatizadas
        run: flutter test --coverage


  build_android:
    name: Compilar APK Android
    needs: [quality_gate]
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar Archivos de Plataforma Android
        run: |
          flutter create --project-name food_tracker --platforms android .
          cp -rf lib/assets/launcher_icons/android/* android/app/src/main/res/ 2>/dev/null || true

      - name: Configurar Compatibilidad de Android SDK (compileSdk 34)
        run: |
          # Redirigir android-35 a android-34 para evitar bug de AAPT2 con tabla de recursos
          if [ -d "/usr/local/lib/android/sdk/platforms/android-35" ]; then
            sudo rm -rf /usr/local/lib/android/sdk/platforms/android-35 2>/dev/null || true
            sudo ln -sf /usr/local/lib/android/sdk/platforms/android-34 /usr/local/lib/android/sdk/platforms/android-35 2>/dev/null || true
            echo "✅ android-35 redirigido a android-34 en SDK"
          fi

          echo "compileSdkVersion=34" >> android/gradle.properties
          echo "flutter.compileSdkVersion=34" >> android/gradle.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties 2>/dev/null || true

          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle.kts
            sed -i 's/compileSdk = [0-9]*/compileSdk = 34/' android/app/build.gradle.kts
          fi

          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.22'/" android/build.gradle 2>/dev/null || true
          fi

      - name: Configurar Nombre y Permisos
        run: |
          sed -i 's/android:label=".*"/android:label="Food Tracker"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/' android/app/src/main/AndroidManifest.xml

      - name: Configurar Firma Criptográfica Permanente (Keystore)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          mkdir -p assets/keystore
          mkdir -p android/app
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d -i > assets/keystore/release.keystore
            cp assets/keystore/release.keystore android/app/release.keystore
            cp assets/keystore/release.keystore ~/.android/debug.keystore
            echo "✅ Keystore restaurado desde GitHub Secrets (ANDROID_KEYSTORE_BASE64)"
          elif [ -f "assets/keystore/release.keystore" ]; then
            cp assets/keystore/release.keystore android/app/release.keystore
            cp assets/keystore/release.keystore ~/.android/debug.keystore
            echo "✅ Keystore local configurado en android/app/release.keystore"
          else
            echo "❌ ERROR: No se detectó ANDROID_KEYSTORE_BASE64 ni assets/keystore/release.keystore"
            exit 1
          fi

          # Inyectar signingConfigs.release en android/app/build.gradle.kts y android/app/build.gradle
          python3 - << 'EOF'
          import os, re

          kts_path = "android/app/build.gradle.kts"
          gradle_path = "android/app/build.gradle"

          if os.path.exists(kts_path):
              with open(kts_path, "r", encoding="utf-8") as f:
                  content = f.read()

              signing_block = """    signingConfigs {
                  create("release") {
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                      storeFile = file("release.keystore")
                      storePassword = "android"
                      storeType = "PKCS12"
                  }
              }
          """
              if 'create("release")' not in content:
                  content = content.replace("buildTypes {", signing_block + "\n    buildTypes {")

              content = re.sub(
                  r'signingConfig\s*=\s*signingConfigs\S*',
                  'signingConfig = signingConfigs.getByName("release")',
                  content
              )
              with open(kts_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("✅ signingConfigs.release inyectado exitosamente en " + kts_path)

          if os.path.exists(gradle_path):
              with open(gradle_path, "r", encoding="utf-8") as f:
                  content = f.read()

              signing_block = """    signingConfigs {
                  release {
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                      storeFile file('release.keystore')
                      storePassword 'android'
                      storeType 'PKCS12'
                  }
              }
          """
              if "signingConfigs {" not in content:
                  content = content.replace("buildTypes {", signing_block + "\n    buildTypes {")

              content = re.sub(
                  r'signingConfig\s+signingConfigs\.debug',
                  'signingConfig signingConfigs.release',
                  content
              )
              content = re.sub(
                  r'signingConfig\s*=\s*signingConfigs\.debug',
                  'signingConfig = signingConfigs.release',
                  content
              )
              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("✅ signingConfigs.release inyectado exitosamente en " + gradle_path)
          EOF

          if [ -f "android/app/release.keystore" ]; then
            echo "✅ Keystore verificado en android/app/release.keystore:"
            sha256sum android/app/release.keystore
          else
            echo "❌ ERROR: android/app/release.keystore no encontrado"
            exit 1
          fi

      - name: Restaurar Dependencias
        run: flutter pub get

      - name: Alinear compileSdk 34 en dependencias de Gradle
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'androidx.core:core:1.13.1'
                      force 'androidx.core:core-ktx:1.13.1'
                      force 'androidx.activity:activity:1.9.3'
                      force 'androidx.activity:activity-ktx:1.9.3'
                      force 'androidx.fragment:fragment:1.8.5'
                      force 'androidx.fragment:fragment-ktx:1.8.5'
                  }
              }
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 34
                          buildToolsVersion "34.0.0"
                      }
                  }
              }
          }
          EOF
          echo "compileSdkVersion=34" >> ~/.gradle/gradle.properties
          echo "compileSdk=34" >> ~/.gradle/gradle.properties
          echo "flutter.compileSdkVersion=34" >> ~/.gradle/gradle.properties

          for cp in "$HOME/.pub-cache" "${PUB_CACHE:-$HOME/.pub-cache}"; do
            if [ -d "$cp" ]; then
              find "$cp" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/compileSdkVersion[ (].*/compileSdkVersion 34/g' {} + 2>/dev/null || true
              find "$cp" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/compileSdk[ ]*=[ ]*[0-9]+/compileSdk = 34/g' {} + 2>/dev/null || true
              find "$cp" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/compileSdk[ ]+[0-9]+/compileSdk 34/g' {} + 2>/dev/null || true
              find "$cp" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/targetSdk[ ]*=[ ]*[0-9]+/targetSdk = 34/g' {} + 2>/dev/null || true
              find "$cp" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/targetSdkVersion[ (].*/targetSdkVersion 34/g' {} + 2>/dev/null || true
            fi
          done

      - name: Extraer Versión de pubspec.yaml
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1 | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Versión detectada para APK: $VERSION"

      - name: Compilar APK (Fat APK)
        run: flutter build apk --release --build-name=${{ steps.app_version.outputs.VERSION }} --build-number=${{ github.run_number }}

      - name: Verificar Firma Criptográfica del APK Compilado
        run: |
          BUILD_TOOLS_DIR=$(find /usr/local/lib/android/sdk/build-tools -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS_DIR" ] && [ -n "$ANDROID_SDK_ROOT" ]; then
            BUILD_TOOLS_DIR=$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -f "$BUILD_TOOLS_DIR/apksigner" ]; then
            echo "🔍 Verificando certificados del APK con apksigner ($BUILD_TOOLS_DIR/apksigner)..."
            "$BUILD_TOOLS_DIR/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk
          else
            echo "⚠️ apksigner no localizado, validando existencia del APK"
            ls -lh build/app/outputs/flutter-apk/app-release.apk
          fi

      - name: Renombrar APK para Release
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Victor-Engineer-Food-Tracker-Android.apk

      - name: Subir Artifact Temporal de Android
        uses: actions/upload-artifact@v4
        with:
          name: Victor-Engineer-Food-Tracker-Android-APK
          path: dist/Victor-Engineer-Food-Tracker-Android.apk

  publish_release:
    name: Publicar GitHub Release
    needs: [quality_gate, build_android]
    if: always() && !cancelled() && needs.quality_gate.result == 'success' && needs.build_android.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Descargar Artifacts Compilados
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: ./dist

      - name: Crear Release Oficial en GitHub
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Victor Engineer - Food Tracker ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
