name: Publicar Release Oficial

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality_gate:
    name: Quality Gate (Analyze & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Restaurar Dependencias
        run: flutter pub get

      - name: Linter y Análisis Estático (Quality Gate)
        run: flutter analyze

      - name: Ejecutar Pruebas Automatizadas
        run: flutter test --coverage

  build_windows:
    name: Compilar Ejecutable Windows x64
    needs: [quality_gate]
    runs-on: windows-2022

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Entorno Visual Studio C++ (MSVC)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Habilitar Soporte de Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Generar Archivos de Plataforma Windows
        run: flutter create --project-name food_tracker --platforms windows .

      - name: Restaurar Dependencias
        run: flutter pub get

      - name: Compilar Aplicación para Windows
        run: flutter build windows --release

      - name: Empaquetar Binario en Archivo ZIP
        shell: pwsh
        run: |
          $releasePath = if (Test-Path "build\windows\x64\runner\Release") { 
              "build\windows\x64\runner\Release" 
          } elseif (Test-Path "build\windows\runner\Release") { 
              "build\windows\runner\Release" 
          } else { 
              Get-ChildItem -Path "build\windows" -Recurse -Filter "*.exe" | Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          }
          Write-Host "Directorio de release detectado: $releasePath"

          # Verificar y asegurar que sqlite3.dll este presente en el directorio de release
          if (-not (Test-Path "$releasePath\sqlite3.dll")) {
              Write-Warning "sqlite3.dll no esta directamente en $releasePath. Buscando en build\windows..."
              $foundSqlite = Get-ChildItem -Path "build\windows" -Recurse -Filter "sqlite3.dll" | Select-Object -First 1
              if ($foundSqlite) {
                  Write-Host "Copiando $($foundSqlite.FullName) a $releasePath"
                  Copy-Item -Path $foundSqlite.FullName -Destination $releasePath -Force
              } else {
                  Write-Host "Descargando sqlite3.dll oficial (x64) para Windows..."
                  Invoke-WebRequest -Uri "https://www.sqlite.org/2024/sqlite-dll-win-x64-3460100.zip" -OutFile "sqlite-dll.zip"
                  Expand-Archive "sqlite-dll.zip" -DestinationPath "sqlite-tmp" -Force
                  Copy-Item "sqlite-tmp\sqlite3.dll" -Destination "$releasePath\sqlite3.dll" -Force
                  Write-Host "sqlite3.dll configurado con exito en $releasePath"
              }
          }

          Write-Host "Archivos a empaquetar en: $releasePath"
          Get-ChildItem -Path $releasePath | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize

          New-Item -ItemType Directory -Force -Path "dist"
          Compress-Archive -Path "$releasePath\*" -DestinationPath "dist\Victor-Engineer-Food-Tracker-Windows-x64.zip" -Force
          Write-Host "Archivo ZIP generado exitosamente en dist\Victor-Engineer-Food-Tracker-Windows-x64.zip"

      - name: Subir Artifact Temporal de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Victor-Engineer-Food-Tracker-Windows-x64
          path: dist/Victor-Engineer-Food-Tracker-Windows-x64.zip

  build_android:
    name: Compilar APK Android
    needs: [quality_gate]
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Generar Archivos de Plataforma Android
        run: flutter create --project-name food_tracker --platforms android .

      - name: Configurar Compatibilidad de Android SDK (compileSdk 34)
        run: |
          # Redirigir android-35 a android-34 para evitar bug de AAPT2 con tabla de recursos
          if [ -d "/usr/local/lib/android/sdk/platforms/android-35" ]; then
            sudo rm -rf /usr/local/lib/android/sdk/platforms/android-35 2>/dev/null || true
            sudo ln -sf /usr/local/lib/android/sdk/platforms/android-34 /usr/local/lib/android/sdk/platforms/android-35 2>/dev/null || true
            echo "✅ android-35 redirigido a android-34 en SDK"
          fi

          echo "compileSdkVersion=34" >> android/gradle.properties
          echo "flutter.compileSdkVersion=34" >> android/gradle.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties 2>/dev/null || true

          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle.kts
            sed -i 's/compileSdk = [0-9]*/compileSdk = 34/' android/app/build.gradle.kts
          fi

          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.22'/" android/build.gradle 2>/dev/null || true
          fi

      - name: Configurar Nombre y Permisos
        run: |
          sed -i 's/android:label=".*"/android:label="VE Food Tracker"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml

      - name: Configurar Firma Criptográfica Permanente (Keystore)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          mkdir -p assets/keystore
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > assets/keystore/release.keystore
            cp assets/keystore/release.keystore ~/.android/debug.keystore
            echo "✅ Keystore restaurado desde GitHub Secrets (ANDROID_KEYSTORE_BASE64)"
          elif [ -f "assets/keystore/release.keystore" ]; then
            cp assets/keystore/release.keystore ~/.android/debug.keystore
            echo "✅ Keystore local configurado"
          else
            echo "⚠️ No se detectó ANDROID_KEYSTORE_BASE64 ni release.keystore; se usará keystore por defecto"
          fi

      - name: Restaurar Dependencias
        run: flutter pub get

      - name: Alinear compileSdk 34 en dependencias de Gradle
        run: |
          mkdir -p ~/.gradle
          echo "compileSdkVersion=34" >> ~/.gradle/gradle.properties
          echo "compileSdk=34" >> ~/.gradle/gradle.properties
          echo "flutter.compileSdkVersion=34" >> ~/.gradle/gradle.properties

          for cp in "$HOME/.pub-cache" "${PUB_CACHE:-$HOME/.pub-cache}"; do
            if [ -d "$cp" ]; then
              find "$cp" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/compileSdkVersion[ (].*/compileSdkVersion 34/g' {} + 2>/dev/null || true
              find "$cp" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/compileSdk[ ]*=[ ]*[0-9]+/compileSdk = 34/g' {} + 2>/dev/null || true
              find "$cp" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/compileSdk[ ]+[0-9]+/compileSdk 34/g' {} + 2>/dev/null || true
              find "$cp" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/targetSdk[ ]*=[ ]*[0-9]+/targetSdk = 34/g' {} + 2>/dev/null || true
              find "$cp" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/targetSdkVersion[ (].*/targetSdkVersion 34/g' {} + 2>/dev/null || true
            fi
          done

      - name: Extraer Versión de pubspec.yaml
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1 | tr -d ' ')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Versión detectada para APK: $VERSION"

      - name: Compilar APK (Fat APK)
        run: flutter build apk --release --build-name=${{ steps.app_version.outputs.VERSION }} --build-number=${{ github.run_number }}

      - name: Renombrar APK para Release
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Victor-Engineer-Food-Tracker-Android.apk

      - name: Subir Artifact Temporal de Android
        uses: actions/upload-artifact@v4
        with:
          name: Victor-Engineer-Food-Tracker-Android-APK
          path: dist/Victor-Engineer-Food-Tracker-Android.apk

  publish_release:
    name: Publicar GitHub Release
    needs: [quality_gate, build_windows, build_android]
    if: always() && !cancelled() && needs.quality_gate.result == 'success' && needs.build_android.result == 'success' && needs.build_windows.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Descargar Artifacts Compilados
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: ./dist

      - name: Crear Release Oficial en GitHub
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Victor Engineer - Food Tracker ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.zip
