name: food_tracker
description: "Food Tracker"
publish_to: 'none'

version: 1.2.2+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get_it: ^9.0.0
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.3.4
  path_provider: ^2.1.5
  path: ^1.9.1
  google_generative_ai: ^0.4.6
  flutter_secure_storage: ^11.2.0
  google_fonts: ^9.0.0
  image_picker: ^1.1.2
  image: ^4.5.2
  http: ^1.3.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  flutter_svg: ^2.0.17
  home_widget: '>=0.9.0 <0.10.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - lib/assets/images/
    - lib/assets/android_widgets/
