  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  image: ^4.5.2
  mobile_scanner: ^5.2.3
  http: ^1.3.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
