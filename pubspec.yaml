name: food_tracker
description: "Victor Engineer - Food Tracker (NutriTracker Local-First)"
publish_to: 'none'

version: 0.1.0-alpha+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.2
  path: ^1.9.0
  google_generative_ai: ^0.4.6
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  image: ^4.2.0
  mobile_scanner: ^5.2.3
  http: ^1.2.1
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - lib/assets/images/

